<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ورود به سامانه مدیریت مالی</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0b0f19">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/static/icons/icon.svg">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">

    <!-- Bootstrap RTL & Icons & Vazirmatn -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="/static/css/theme.css">

    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 36px 30px;
            border-radius: 26px;
            background: #121824;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <div class="dock-brand mx-auto mb-3" style="width: 58px; height: 58px; font-size: 1.6rem; border-radius: 18px;">
                <i class="bi bi-wallet2"></i>
            </div>
            <h4 class="fw-bold text-white mb-1">سامانه حسابداری من</h4>
            <span class="text-secondary small">ورود به حساب مدیریت مالی</span>
        </div>

        {% if error %}
        <div class="alert alert-danger py-2 text-center rounded-3 mb-4" style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5;" role="alert">
            {{ error }}
        </div>
        {% endif %}

        <form method="post" action="/login">
            <div class="mb-3">
                <label class="form-label text-secondary small fw-medium">نام کاربری</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person text-secondary"></i></span>
                    <input type="text" name="username" class="form-control text-start latin-num" placeholder="نام کاربری..." required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label text-secondary small fw-medium">رمز عبور</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-key text-secondary"></i></span>
                    <input type="password" name="password" class="form-control text-start" placeholder="رمز عبور..." required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold fs-6">
                <i class="bi bi-box-arrow-in-left me-1"></i> ورود امن
            </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25 text-muted small">
            <span>مدیریت هوشمند و یکپارچه امور مالی</span>
        </div>
    </div>
</body>
</html>
