<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به سیستم حسابداری</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #eef2f7; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: system-ui, Tahoma, sans-serif; }
        .login-card { width: 100%; max-width: 400px; padding: 25px; border-radius: 12px; background: #fff; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <i class="bi bi-shield-lock-fill text-primary" style="font-size: 3rem;"></i>
            <h4 class="mt-2 fw-bold">ورود به سیستم مالی</h4>
        </div>
        {% if error %}
        <div class="alert alert-danger py-2 text-center" role="alert">
            {{ error }}
        </div>
        {% endif %}
        <form method="post" action="/login">
            <div class="mb-3">
                <label class="form-label">نام کاربری</label>
                <input type="text" name="username" class="form-control text-start" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label">کلمه عبور</label>
                <input type="password" name="password" class="form-control text-start" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">ورود</button>
        </form>
    </div>
</body>
</html>
