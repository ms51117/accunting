    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@majidh1/jalalidatepicker@0.9.6/dist/jalalidatepicker.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            if (typeof jalaliDatepicker !== "undefined") {
                jalaliDatepicker.startWatch({
                    container: "body",       // پیش‌فرضش هم // ← این کمئن باش
                    zIndex: 2147483647,      // ← این کافیه، دیگه CSS نزن
                    showEmptyBtn: true,
                    autoHide: true
                });
                console.log("✅ jalaliDatepicker لود و فعال شد");
            } else {
                console.error("❌ jalaliDatepicker لود نشد");
            }
        });
    </script>

    <!-- اسکریپت فرمت سه‌رقم سه‌رقم مبالغ هنگام تایپ -->
    <script>
    document.addEventListener("DOMContentLoaded", function () {
        // تابع تبدیل اعداد فارسی/عربی به انگلیسی
        function toEnglishDigits(str) {
            return str.replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d))
                      .replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
        }

        // تابع ۳ رقم جدا کردن
        function formatNumber(value) {
            let clean = toEnglishDigits(value).replace(/\D/g, ""); // حذف هر چیزی غیر از عدد
            if (!clean) return "";
            return clean.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }

        // انتخاب تمام فیلدهای مبلغ
        function applyCurrencyMask() {
            const inputs = document.querySelectorAll('input.currency-input, input[name="amount"], input[name="pay_amount"], input[name="balance"],input[name="paid_amount"]');

            inputs.forEach(input => {
                // تغییر تایپ به text برای اجازه دادن به کاما
                input.type = "text";
                input.setAttribute("inputmode", "numeric");
                input.setAttribute("autocomplete", "off");

                // اگر مقدار اولیه دارد فرمت شود
                if (input.value) {
                    input.value = formatNumber(input.value);
                }

                // هنگام تایپ کاربر
                input.addEventListener("input", function (e) {
                    const cursorPosition = this.selectionStart;
                    const originalLength = this.value.length;

                    this.value = formatNumber(this.value);

                    // حفظ موقعیت کرسر
                    const newLength = this.value.length;
                    const newPosition = cursorPosition + (newLength - originalLength);
                    this.setSelectionRange(newPosition, newPosition);
                });
            });
        }

        // حذف کاماها قبل از ارسال فرم به بک‌اند تا پایتون خطا نگیرد
        document.querySelectorAll("form").forEach(form => {
            form.addEventListener("submit", function () {
                const inputs = this.querySelectorAll('input.currency-input, input[name="amount"], input[name="pay_amount"], input[name="balance"],input[name="paid_amount"]');
                inputs.forEach(input => {
                    input.value = toEnglishDigits(input.value).replace(/\D/g, "");
                });
            });
        });

        applyCurrencyMask();
    });
    </script>

</body>
</html>
