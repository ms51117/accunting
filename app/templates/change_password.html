{% extends "base.html" %}

{% block content %}
<div class="container py-4" style="max-width: 550px;">
    <div class="card shadow-sm border-0 rounded-3">
        <div class="card-header bg-primary text-white py-3">
            <h5 class="mb-0 text-center fw-bold">
                <i class="bi bi-shield-lock me-2"></i>تغییر نام کاربری و رمز عبور
            </h5>
        </div>
        <div class="card-body p-4">

            {% if error %}
            <div class="alert alert-danger d-flex align-items-center mb-3" role="alert">
                <i class="bi bi-exclamation-triangle-fill flex-shrink-0 me-2"></i>
                <div>{{ error }}</div>
            </div>
            {% endif %}

            {% if success %}
            <div class="alert alert-success d-flex align-items-center mb-3" role="alert">
                <i class="bi bi-check-circle-fill flex-shrink-0 me-2"></i>
                <div>{{ success }}</div>
            </div>
            {% endif %}

            <form action="/change-password" method="POST">
                <div class="mb-3">
                    <label class="form-label text-muted fw-semibold">رمز عبور فعلی <span class="text-danger">*</span></label>
                    <input type="password" name="old_password" class="form-control" placeholder="رمز فعلی خود را وارد کنید" required>
                </div>

                <hr class="my-3 text-muted">

                <div class="mb-3">
                    <label class="form-label text-muted fw-semibold">نام کاربری جدید (اختیاری)</label>
                    <input type="text" name="new_username" class="form-control" placeholder="در صورت تمایل به تغییر نام کاربری وارد کنید">
                    <div class="form-text">اگر نمی‌خواهید نام کاربری تغییر کند، این فیلد را خالی بگذارید.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label text-muted fw-semibold">رمز عبور جدید <span class="text-danger">*</span></label>
                    <input type="password" name="new_password" class="form-control" placeholder="حداقل ۴ کاراکتر" required>
                </div>

                <div class="mb-4">
                    <label class="form-label text-muted fw-semibold">تکرار رمز عبور جدید <span class="text-danger">*</span></label>
                    <input type="password" name="confirm_password" class="form-control" placeholder="تکرار رمز جدید" required>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary py-2 fw-semibold">
                        <i class="bi bi-save me-1"></i> ذخیره تغییرات
                    </button>
                    <a href="/" class="btn btn-outline-secondary py-2">انصراف و بازگشت</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
