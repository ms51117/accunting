<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162238" />
      <stop offset="100%" stop-color="#0b111e" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#bgGrad)" stroke="#2563eb" stroke-opacity="0.3" stroke-width="6" />

  <!-- Inner Ambient Glow Circle -->
  <circle cx="256" cy="256" r="160" fill="url(#glowGrad)" opacity="0.15" filter="url(#glow)" />

  <!-- Modern Financial Symbol (Dynamic V / Diamond Wallet) -->
  <g transform="translate(256, 256) scale(1.1) translate(-256, -256)" filter="url(#glow)">
    <!-- Wallet Card Shape -->
    <rect x="136" y="156" width="240" height="170" rx="36" fill="url(#accentGrad)" />
    <!-- Wallet Flap Accent -->
    <path d="M 136 210 Q 256 240 376 210" stroke="#60a5fa" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.5" />
    <!-- Center Coin / Lock Emblem -->
    <circle cx="310" cy="241" r="24" fill="#0f172a" />
    <circle cx="310" cy="241" r="14" fill="#38bdf8" />
    <!-- Trending Up Arrow -->
    <path d="M 180 376 L 250 306 L 295 345 L 365 270" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="335,270 365,270 365,300" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
